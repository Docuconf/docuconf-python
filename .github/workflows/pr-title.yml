name: pr-title

# Squash merges use the PR title as the commit message, and release-please
# reads those to pick the next version and write CHANGELOG.md, so the title
# must be a Conventional Commit: "type(optional scope): summary".
# See CONTRIBUTING.md.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

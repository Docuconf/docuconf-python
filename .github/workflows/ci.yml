name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      docuconf_go_ref:
        description: docuconf-go ref to test against (empty = .github/docuconf-go.ref)
        required: false
        default: ""
  # Nightly against docuconf-go main, to catch spec changes before a bump PR.
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        deps: [latest]
        include:
          # The oldest versions pyproject.toml allows.
          - python: "3.10"
            deps: minimum
    steps:
      - uses: actions/checkout@v4

      # The contract meta-schema (spec/cue) and the shared conformance suite
      # (conformance/cases.json) live in docuconf-go; the export tests vet
      # generated contracts against the first, and tests/test_conformance.py
      # runs the second.
      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_REF" ]; then echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      # The docuconf-go-facing subset (conformance suite, cue vet of exported
      # contracts); docuconf-go's downstream workflow runs the same script.
      - name: Run scripts/conformance.sh
        run: scripts/conformance.sh
        env:
          DOCUCONF_GO_DIR: ${{ github.workspace }}/docuconf-go
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tls,jsonschema]" pytest PyYAML "ruff==0.16.10" mypy types-PyYAML types-jsonschema \
            fastapi httpx django
          if [ "${{ matrix.deps }}" = minimum ]; then
            python -m pip install "pydantic==2.7.0" "pydantic-settings==2.7.0" "cryptography==42.0.0" "tomli==2.0.1" \
              "jsonschema==4.18.0"
          fi

      # ruff is pinned: new releases add rules and formatting changes that would
      # fail CI without any change here. Bump it deliberately.
      - name: Lint
        if: matrix.deps == 'latest'
        run: |
          ruff check .
          ruff format --check .
          mypy

      - name: Test
        run: pytest
        env:
          DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_REQUIRE_VET: "1"
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"

  # The orders example (examples/orders) builds against this repository's SDK.
  orders-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_REF" ]; then echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1
      # The lint job's ruff covers the example too.
      - name: Build
        working-directory: examples/orders
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt mypy pytest
          python -m mypy --strict app.py
          python -c "import app"
      # The webhook key set: a rotation, and the key sets that fail at boot.
      - name: Test
        working-directory: examples/orders
        run: python -m pytest -p no:cacheprovider test_app.py
      # contract.cue is generated; it must match what the CLI exports today,
      # except metadata.generator.version, which release PRs bump.
      - name: Contract is up to date
        working-directory: examples/orders
        run: |
          python -m docuconf export app:Settings -o "$RUNNER_TEMP/contract.cue"
          ../../scripts/check-generated.sh --files contract.cue "$RUNNER_TEMP/contract.cue"
      - name: Contract passes the meta-schema
        run: |
          mod="$(mktemp -d)"
          cp -r docuconf-go/spec/cue/cue.mod docuconf-go/spec/cue/contract "$mod/"
          mkdir "$mod/orders"
          cp examples/orders/contract.cue "$mod/orders/"
          cd "$mod" && cue vet -c ./orders
      # CONFIG.md, CONFIG.agents.md and docs.json are generated from each
      # example's committed contract.cue (the step above exports to a temp
      # file, so a release's generator.version bump stays as committed) by
      # docuconf docs, built from the docuconf-go checkout. These are the
      # README's commands.
      - name: Generated docs are up to date
        run: |
          (cd docuconf-go/cmd/docuconf && go build -o "$RUNNER_TEMP/docuconf" .)
          for ex in orders app; do
            (
              cd "examples/$ex"
              "$RUNNER_TEMP/docuconf" docs contract.cue --check CONFIG.md
              "$RUNNER_TEMP/docuconf" docs contract.cue --format agents --check CONFIG.agents.md
              "$RUNNER_TEMP/docuconf" docs contract.cue --format model --check docs.json
            )
          done
      - name: Smoke test
        run: examples/orders/smoke.sh
        env:
          PYTHON: python

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      # Install the wheel into a clean environment and use the console script.
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "import docuconf; print(docuconf.__version__)"
          /tmp/smoke/bin/docuconf --version

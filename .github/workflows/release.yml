name: Release

# Publishes to PyPI with trusted publishing (OIDC): no API token is stored.
# See RELEASING.md for the one-time setup.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the docuconf-go ref
        id: dcref
        run: echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install cuelang.org/go/cmd/cue@v0.17.1
      - run: python -m pip install -e ".[tls,jsonschema]" pytest PyYAML fastapi httpx django
      - run: pytest
        env:
          DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_REQUIRE_VET: "1"
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/docuconf/_version.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/docuconf-pydantic/
    permissions:
      id-token: write # trusted publishing; also signs PEP 740 attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Attaches the sdist and wheel to the GitHub Release for the tag. GitHub
  # Packages has no Python registry, so the Release is the GitHub copy. It
  # uses the tested `build` output but does not depend on `publish`, so it
  # works with only the workflow's GITHUB_TOKEN. See RELEASING.md.
  github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload its assets
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach the sdist and wheel to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            flags=()
            # PEP 440 pre-releases: 0.2.0a1, 0.2.0b1, 0.2.0rc1, 0.2.0.dev1.
            if [[ "$version" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "docuconf-pydantic $version" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
